  get: 
    summary: Air Alert Proximity API
    description: "Air-raid alerts and airborne objects near ONE border crossing. Anchor on a checkpoint (ppid), a coordinate pair or a city and get back only what is inside your radius (default 100 km): which regions are under alert, how far each is, and how close any tracked object currently is on a 1-5 proximity band. Regions are returned as ISO 3166-2 region_code, the same classifier the regional fuel data uses. DELIBERATELY NOT REAL-TIME: every response is a snapshot 1-3 minutes old with the lag re-randomised per request and stated in as_of/lag_min, and object coordinates are never returned - only distance, bearing and speed relative to your anchor. Source data is crowd/OSINT-derived and partly hand-moderated: a signal, never ground truth, and never a substitute for official air-raid warnings."
    operationId: get_air_alerts
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID to anchor on, e.g. id_94 — use the Checkpoints Directory API to discover it. Alternative to lat/lon."
        schema: 
          type: string
      - name: lat
        in: query
        description: Latitude of the anchor point (alternative to ppid)
        schema: 
          type: string
      - name: lon
        in: query
        description: Longitude of the anchor point (alternative to ppid)
        schema: 
          type: string
      - name: city
        in: query
        description: "City name — alternative to lat/lon, resolved to coordinates"
        schema: 
          type: string
      - name: country
        in: query
        description: "ISO-2 country code, disambiguates city"
        schema: 
          type: string
      - name: radius_km
        in: query
        description: "Search radius in km around the anchor (default 100, min 10, max 300). The 1-5 proximity band is scaled to this radius: 5 = nearest fifth, 1 = outermost fifth."
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/route-plan: 
  get: 
    summary: Route Planner API
    description: "A door-to-door plan for a border trip, not just a driving time. Returns the route, the crossings actually on it with their live or arrival-time-forecast queue, and the stops a driver really makes — rest breaks, a meal, refuelling — laid out on one timeline. The border is part of that timeline: a long queue satisfies the break that was coming up and resets the driving clock, so a 3-hour wait is never reported as 3 hours PLUS a full set of breaks nobody took. Car stops follow a driving-hygiene model; bus and truck stops respect the mandatory EU 561/2006 rest, and the bus service overhead is calibrated on 1000+ licensed international coach schedules. Set stop_places=1 to name a real rest area or fuel station for each stop. Each border also reports wait_basis: vehicle_lane when your vehicle class has its own measured queue, car_lane when the car-lane queue is the best available signal for that crossing."
    operationId: get_route_plan
    parameters:       - name: origin_lat
        in: query
        description: Origin latitude (required)
        schema: 
          type: string
      - name: origin_lon
        in: query
        description: Origin longitude (required)
        schema: 
          type: string
      - name: dest_lat
        in: query
        description: Destination latitude (required)
        schema: 
          type: string
      - name: dest_lon
        in: query
        description: Destination longitude (required)
        schema: 
          type: string
      - name: vehicle
        in: query
        description: "car (default), bus or truck — picks both the routing profile and the stop model"
        schema: 
          type: string
      - name: depart
        in: query
        description: "ISO-8601 departure time, up to 14 days ahead (default: now). Drives the arrival-time queue forecast"
        schema: 
          type: string
      - name: via
        in: query
        description: "Optional waypoints as lat,lon;lat,lon (max 3) — e.g. to route through a different crossing"
        schema: 
          type: string
      - name: forecast
        in: query
        description: "1 (default) = forecast the queue for your arrival time at each crossing; 0 = use the current queue"
        schema: 
          type: string
      - name: stop_places
        in: query
        description: "1 = name a real rest area / fuel station for each stop (default 0)"
        schema: 
          type: string
      - name: overnight
        in: query
        description: "1 = add an advisory overnight stop when the drive exceeds 11 h (default 0)"
        schema: 
          type: string
      - name: geometry
        in: query
        description: "1 = include the full route geometry (default 0)"
        schema: 
          type: string
      - name: alternatives
        in: query
        description: "1 (default) = include nearby alternative crossings with their queues"
        schema: 
          type: string
      - name: preference
        in: query
        description: "recommended (default), fastest or shortest"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code for checkpoint names (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/fleet-vehicles: 
  get: 
    summary: Fleet Vehicles API
    description: "Your own NakBus Live fleet: every vehicle registered to your company with plate, label, assigned route, public-map flag, status, whether a driver device is currently on shift, and the last measured timetable delay. Owner-scoped — the key sees its own fleet only, including vehicles hidden from the public bus map. Activate fleet tracking at nakordoni.eu/en/developers/fleet (first bus free)."
    operationId: get_fleet_vehicles
    parameters: []
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/fleet-live: 
  get: 
    summary: Fleet Live Positions API
    description: "Where your buses are right now — one row per active vehicle with lat/lon, timestamp and age, speed, bearing and timetable delay, read from the same live store that powers the public bus map. Unlike the public feed this includes vehicles marked non-public and companies that opted out of the public map: it is your own data. Vehicles whose driver device is off shift (or silent for more than 10 minutes) are still listed, with live=false."
    operationId: get_fleet_live
    parameters: []
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/fleet-history: 
  get: 
    summary: Fleet History API
    description: "Recorded GPS track of your own vehicles: every stored position point in a time window, in chronological order, with speed, bearing and accuracy. Filter to one vehicle or take the whole fleet. Window is limited to 31 days per call and 5000 points per response — page through longer periods by moving ?from= to the last returned timestamp."
    operationId: get_fleet_history
    parameters:       - name: vehicle_id
        in: query
        description: Restrict to one of your vehicles (optional; ids come from fleet/vehicles). Omit for the whole fleet.
        schema: 
          type: string
      - name: from
        in: query
        description: "Window start — unix timestamp or ISO-8601 datetime (default: 24 h before `to`). A datetime without an explicit offset is read as UTC."
        schema: 
          type: string
      - name: to
        in: query
        description: "Window end — unix timestamp or ISO-8601 datetime (default: now). The window may not exceed 31 days."
        schema: 
          type: string
      - name: limit
        in: query
        description: "Max points returned, 1-5000 (default 1000, values above 5000 are clamped). `truncated: true` means more points exist in the window."
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
