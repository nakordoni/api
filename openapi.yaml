        schema: 
          type: string
      - name: lang
        in: query
        description: Language for labels and the country name (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
