openapi:3.0.3
info:
title: Nakordoni Developer API
version: 1.0.0
description: "Real-time border queue data for Europe."
contact: 
  name: Nakordoni Dev Support
  url: "https://nakordoni.eu/en/developers/tickets"
license: 
  name: See attribution requirements
  url: "https://nakordoni.eu/en/developers/docs#attribution"
servers:- url: "https://nakordoni.eu/api/v1/data"
  description: Production
security:- BearerAuth: []
components:
securitySchemes: 
  BearerAuth: 
    type: http
    scheme: bearer
    bearerFormat: "NKD-DEV-XXXX-XXXX-XXXX"
paths:
/status: 
  get: 
    summary: API Status
    description: "Live health of every Developer-API product: online / degraded / offline, response latency and last-checked time, plus an overall rollup. Public — no API key required, never counts against your quota. Refreshed every 5 minutes. Mirrors the human status page at nakordoni.eu/{lang}/status."
    operationId: get_status
    parameters: []
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/checkpoints: 
  get: 
    summary: Checkpoints Directory API
    description: "Directory of all monitored border checkpoints: IDs, names, countries, coordinates and status. Use it to discover ppid values for the other APIs. Each row carries has_day_stats — false means the Best Time to Cross API has no matrix for that checkpoint and would answer 404, so skip it instead of polling."
    operationId: get_checkpoints
    parameters:       - name: country
        in: query
        description: "Filter by numeric country code (1=UA, 2=PL, 3=SK, 4=HU, 5=RO, 6=MD, 7=BY, 8=LT, 9=LV, …)"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language for checkpoint names (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/multi: 
  get: 
    summary: "Multi-Checkpoint API"
    description: "Fetch live queue status and/or data freshness for up to 20 checkpoints in a single request. Designed for dashboard builders who poll many PPIDs simultaneously — reduces 20+ individual calls to one. Quota counts as ⌈(N PPIDs × sub-products) / 2⌉ — 50% cheaper than the equivalent individual calls. Use include=queue,update-info to get both datasets at once."
    operationId: get_multi
    parameters:       - name: ppids
        in: query
        description: "Comma-separated list of checkpoint IDs (required, max 20) — e.g. id_2,id_13,id_15,id_59"
        schema: 
          type: string
      - name: include
        in: query
        description: "Comma-separated sub-products to include: queue, update-info (default: queue,update-info)"
        schema: 
          type: string
      - name: lang
        in: query
        description: "Language code for checkpoint names in queue responses (default: en)"
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/border: 
  get: 
    summary: Border Queue API
    description: "All checkpoints on a given border + vehicle type in one call — live queue, wait estimate, and data freshness for every crossing point. Supports single destination, comma-separated list, or \"all\" to query all neighbours at once. Results sorted by queue length ascending, each checkpoint tagged with its border country."
    operationId: get_border
    parameters:       - name: origin
        in: query
        description: "Origin country code (URL path segment): 1=Ukraine, 2=Poland, 3=Slovakia, 4=Hungary, 5=Romania, 6=Moldova, 7=Belarus, 8=Lithuania, 9=Latvia, 11=Slovenia, 12=Bulgaria, 13=Serbia, 14=Turkey, 15=North Macedonia, 16=Croatia, 17=Bosnia, 18=Germany, 19=Greece, 20=Italy, 21=Albania, 22=Montenegro, 23=Kosovo"
        schema: 
          type: string
      - name: destination
        in: query
        description: "Destination (URL path segment): single country code, comma-separated list (e.g. 2,3,5), or \"all\" to expand to all neighbours with monitored data"
        schema: 
          type: string
      - name: crossing_type
        in: query
        description: "Vehicle type (URL path segment): 4=car, 5=taxfree car, 6=bus, 7=pedestrian, 8=truck<7.5t, 9=truck"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language for checkpoint names in the response (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/search: 
  get: 
    summary: Checkpoint Search API
    description: "Find checkpoint PPIDs by name. Pass a single name or a comma-separated list (up to 20). Searches all translation languages; returns all PPIDs at that location grouped by vehicle type (4=car, 5=taxfree car, 6=bus, 7=pedestrian, 8=truck<7.5t, 9=truck). Use this to quickly discover the right ppid before calling the queue or forecast APIs."
    operationId: get_search
    parameters:       - name: name
        in: query
        description: "Checkpoint name or comma-separated names, in any language (e.g. Krakovets, Краківець, Krakivets)"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language for returned names (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/queue: 
  get: 
    summary: Live Border Queue API
    description: "Real-time queue length, wait estimate and status for any monitored checkpoint, plus hourly/daily aggregates."
    operationId: get_queue
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13 (see /api/v1/data/checkpoints)"
        schema: 
          type: string
      - name: section
        in: query
        description: Data section (optional)
        schema: 
          type: string
      - name: origin
        in: query
        description: Origin country code (optional)
        schema: 
          type: string
      - name: destination
        in: query
        description: Destination country code (optional)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/queue-advanced: 
  get: 
    summary: Advanced Wait Time API
    description: "Wait time adjusted for live traffic flow and weather, with a full breakdown of each adjustment, plus the same wait_status/trend fields as border and multi. Billed at 1.5x a normal heavy-class call, reflecting the extra traffic/weather/driver-report lookups. Granted on request."
    operationId: get_queue_advanced
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13 (see /api/v1/data/checkpoints)"
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/stats: 
  get: 
    summary: Checkpoint Hourly Statistics API
    description: "Hourly historical queue stats per checkpoint and date: 24 hourly values, daily avg/min/max, peak and quietest hours, day-over-day comparison."
    operationId: get_stats
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13 (see /api/v1/data/checkpoints)"
        schema: 
          type: string
      - name: date
        in: query
        description: "YYYY-MM-DD (default: yesterday)"
        schema: 
          type: string
      - name: compare
        in: query
        description: "1 = include previous day + delta"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code (default uk)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/day-stats: 
  get: 
    summary: Best Time to Cross API
    description: "Typical-week load statistics per checkpoint: 7×24 day-of-week × hour matrix (median + p25/p75 band), quietest/busiest day, best/worst 2-hour windows. Precomputed daily from ~60 days of real observations."
    operationId: get_day_stats
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language for weekday/unit labels (default uk)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/forecast: 
  get: 
    summary: Queue Forecast API
    description: "ML ensemble forecast of queue levels: 24-hour and 7-day (168h) horizons with confidence bounds. The same model that powers nakordoni.eu predictions."
    operationId: get_forecast
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13 (see /api/v1/data/checkpoints)"
        schema: 
          type: string
      - name: prediction_steps
        in: query
        description: "24 (default) or 168 for 7-day"
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/alternatives: 
  get: 
    summary: Checkpoint Alternatives API
    description: "Nearby alternative checkpoints on the same border with current queues and distance deltas. By default filters to the same vehicle type as the requested ppid. Use crossing_type to override — e.g. crossing_type=4 for cars, crossing_type=7 for pedestrians."
    operationId: get_alternatives
    parameters:       - name: ppid
        in: query
        description: Checkpoint ID (e.g. id_13)
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code (default uk)
        schema: 
          type: string
      - name: crossing_type
        in: query
        description: "Optional vehicle type override: 4=car, 5=taxfree car, 6=bus, 7=pedestrian, 8=truck<7.5t, 9=truck. Defaults to same type as the requested ppid."
        schema: 
          type: string
      - name: limit
        in: query
        description: "Max results (1–10, default 5)"
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/update-info: 
  get: 
    summary: "Live Queue & Freshness API"
    description: "Current queue length for one checkpoint plus how fresh that reading is — returns queue_now, freshness, age_minutes, is_realtime, status, timestamp and timezone. This is the STANDARD-class way to poll live queue data: use it for frequent refreshes and keep the heavy quota for /queue, /multi and /forecast, which return the fuller payload (wait_min, trend, history)."
    operationId: get_update_info
    parameters:       - name: ppid
        in: query
        description: "Checkpoint ID, e.g. id_13 (see /api/v1/data/checkpoints)"
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/fuel: 
  get: 
    summary: EU Fuel Prices API
    description: "Fuel prices across EU countries — country averages, nearest stations by coordinates, or stations near a border checkpoint. Aggregated from official national price registries and market data. A single-country answer carries a `grades` object mapping each price key (petrol, petrol95plus, petrol92, petrol98, diesel, lpg) to its canonical grade and to the local pump name for that country; the all-countries summary carries the canonical mapping only, as `grade_keys`."
    operationId: get_fuel
    parameters:       - name: mode
        in: query
        description: "country (default) | nearest | border. country = national average; nearest = stations near lat/lon; border = stations near a checkpoint"
        schema: 
          type: string
      - name: country
        in: query
        description: "ISO country code for mode=country (PL, DE, AT, FR, ES, IT, PT, SI, LU, RO, DK, HR, HU, SK, UA, …)"
        schema: 
          type: string
      - name: lat
        in: query
        description: "Latitude for mode=nearest"
        schema: 
          type: string
      - name: lon
        in: query
        description: "Longitude for mode=nearest (alias: lng)"
        schema: 
          type: string
      - name: radius_km
        in: query
        description: "Search radius km for mode=nearest (default 30; alias: radius)"
        schema: 
          type: string
      - name: ppid
        in: query
        description: "Checkpoint ID for mode=border (e.g. id_13)"
        schema: 
          type: string
      - name: fuel_type
        in: query
        description: "Optional, for mode=nearest: diesel | e5 | e10 | superplus | super100 | premdiesel | truckdiesel | hvo | lpg | cng | adblue | e85 | lng (availability varies by station/region). Local pump names are accepted as well — ON, Olej napędowy, Pb95, Nafta, Dizel, Gázolaj, Motorină, Benzină 95, ДП, А-95, Motorin, Gasóleo, Sans plomb 95, Bleifrei … — resolved against `country` (or, for coordinate products, the country the point falls in), because the same wording is not the same grade everywhere: “95” is E10 at a Danish, Finnish, French, British, Belgian or Dutch pump and E5 at a Polish or German one. The response echoes `fuel_type` (canonical), `fuel_type_requested` (as you typed it) and `fuel_type_local`. A name we cannot place is never swapped for a default grade — the answer comes back empty and says so. Full table of names per country: /api/v2/data/fuel-grades."
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code for labels
        schema: 
          type: string
      - name: limit
        in: query
        description: "Max stations returned for mode=nearest/border (default 5)"
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
/fuel-cities: 
  get: 
    summary: Fuel Prices by City API
    description: "Per-city fuel price summary for a country: cheapest station price and average across the top 5 stations in each major city. City-level data today: AT, DE, ES, FR, HR, IT, LU, PT, SI, DK — RO is accepted but has no priced stations yet and returns no cities. Which grades a country can answer differs sharply (SI, IT and PT carry diesel only; HR diesel and lpg; DE, AT, FR and LU carry most of the range), so every response reports `available_fuel_types` derived from the station data actually reachable from that country's cities — read it before choosing `fuel_type`. Asking for a grade the country has no price for returns `cities: []` and a `note` naming what is available; it is never silently answered with a different grade."
    operationId: get_fuel_cities
    parameters:       - name: country
        in: query
        description: "ISO-2 country code (required). Accepted: at, de, fr, es, it, pt, si, lu, ro, dk, hr — ro currently answers with no cities (no priced stations recorded)"
        schema: 
          type: string
      - name: fuel_type
        in: query
        description: "diesel (default) | e5 | e10 | superplus | super100 | premdiesel | truckdiesel | hvo | lpg | cng | adblue | e85 | lng — availability is per country, not per platform. Read `available_fuel_types` in the response and pick from it; a grade absent from that list returns an empty `cities` array with a `note`, not a fallback grade. Local pump names are accepted as well — ON, Olej napędowy, Pb95, Nafta, Dizel, Gázolaj, Motorină, Benzină 95, ДП, А-95, Motorin, Gasóleo, Sans plomb 95, Bleifrei … — resolved against `country` (or, for coordinate products, the country the point falls in), because the same wording is not the same grade everywhere: “95” is E10 at a Danish, Finnish, French, British, Belgian or Dutch pump and E5 at a Polish or German one. The response echoes `fuel_type` (canonical), `fuel_type_requested` (as you typed it) and `fuel_type_local`. A name we cannot place is never swapped for a default grade — the answer comes back empty and says so. Full table of names per country: /api/v2/data/fuel-grades."
        schema: 
          type: string
      - name: lang
        in: query
        description: Language code for city names (default en)
        schema: 
          type: string
    responses: 
      200: 
        description: Success
        content: 
          application/json: 
            schema: 
              type: object
      401: 
        description: Unauthorized
      429: 
        description: Rate limit exceeded
