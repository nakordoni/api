        description: Language code for country names and summary (default en)
        schema: 
          type: string
      - name: include_ua_heat
        in: query
        description: "1 = also return Ukraine's computed summer heat ban (trucks >24 t banned 10:00-22:00 when forecast temp >+28 °C), per oblast. Included automatically when Ukraine is in scope (country=UA) — this flag only adds it to a request scoped to some other country"
